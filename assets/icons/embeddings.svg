<svg xmlns="http://www.w3.org/2000/svg" width="82" height="88" viewBox="0 0 82 88" role="img"><title>Embeddings</title><defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.mark{fill:none;stroke:#A78BFA;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:url(#g);transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}.label{fill:#94A3B8;font:700 8.5px Arial,sans-serif;letter-spacing:.2px;animation:shine 3.6s .65ss ease-in-out infinite}@keyframes float{50%{transform:translateY(-3px)}}@keyframes pulse{50%{transform:scale(1.09)}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes scan{0%,100%{opacity:.55}50%{opacity:1;transform:translateX(3px)}}@keyframes shine{0%,60%,100%{fill:#64748B;filter:none;opacity:.72}72%,86%{fill:#F8FAFC;filter:url(#g);opacity:1}}@media(prefers-reduced-motion:reduce){.mark,.label{animation:none}}</style></defs><g class="mark"><circle cx="24" cy="25" r="4"/><circle cx="55" cy="22" r="4"/><circle cx="60" cy="48" r="4"/><circle cx="31" cy="51" r="4"/><circle cx="42" cy="36" r="5"/><path d="M27 27l11 7M46 33l7-8M46 39l11 7M38 40l-5 8M28 25h23"/></g><text class="label" x="41" y="76" text-anchor="middle">Embeddings</text></svg>
