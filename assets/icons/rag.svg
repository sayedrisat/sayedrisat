<svg xmlns="http://www.w3.org/2000/svg" width="82" height="88" viewBox="0 0 82 88" role="img"><title>RAG</title><defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.mark{fill:none;stroke:#22D3EE;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:url(#g);transform-box:fill-box;transform-origin:center;animation:float 3s ease-in-out infinite}.label{fill:#94A3B8;font:700 8.5px Arial,sans-serif;letter-spacing:.2px;animation:shine 3.6s .2ss ease-in-out infinite}@keyframes float{50%{transform:translateY(-3px)}}@keyframes pulse{50%{transform:scale(1.09)}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes scan{0%,100%{opacity:.55}50%{opacity:1;transform:translateX(3px)}}@keyframes shine{0%,60%,100%{fill:#64748B;filter:none;opacity:.72}72%,86%{fill:#F8FAFC;filter:url(#g);opacity:1}}@media(prefers-reduced-motion:reduce){.mark,.label{animation:none}}</style></defs><g class="mark"><path d="M18 20h20v26H18zM44 25h20v26H44z"/><path d="M24 27h8M24 33h8M50 32h8M50 38h8M37 45l9-9"/><circle cx="41" cy="41" r="3" fill="#22D3EE" stroke="none"/></g><text class="label" x="41" y="76" text-anchor="middle">RAG</text></svg>
