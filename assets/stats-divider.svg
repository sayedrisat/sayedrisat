<svg xmlns="http://www.w3.org/2000/svg" width="900" height="28" viewBox="0 0 900 28" role="img"><title>Animated stats divider</title><defs><linearGradient id="a"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#10B981"/></linearGradient><style>.line{fill:none;stroke:url(#a);stroke-width:2;stroke-linecap:round;stroke-dasharray:45 18;animation:flow 2.8s linear infinite}.orb{fill:#22D3EE;animation:move 4s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-126}}@keyframes move{0%,100%{transform:translateX(0);opacity:.3}50%{transform:translateX(840px);opacity:1}}@media(prefers-reduced-motion:reduce){.line,.orb{animation:none}}</style></defs><path class="line" d="M15 14H885"/><circle class="orb" cx="30" cy="14" r="4"/></svg>
