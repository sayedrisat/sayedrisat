<svg xmlns="http://www.w3.org/2000/svg" width="990" height="390" viewBox="0 0 495 195" role="img"><title>Sayed Risat GitHub streak</title><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07101F"/><stop offset=".5" stop-color="#0A101F"/><stop offset="1" stop-color="#11162C"/></linearGradient><linearGradient id="scan"><stop stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE" stop-opacity=".09"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.scan{animation:scan 5s linear infinite}.sep{stroke:#22D3EE;stroke-width:1;stroke-dasharray:22 8;animation:flow 2.8s linear infinite}.ring{fill:none;stroke:#A78BFA;stroke-width:5;stroke-linecap:round;stroke-dasharray:251;transform-origin:247.5px 71px;animation:draw 2.2s ease-in-out infinite alternate,rotate 7s linear infinite;filter:url(#glow)}.fire{fill:#10B981;transform-origin:247.5px 30px;animation:flicker .9s ease-in-out infinite alternate;filter:url(#glow)}.num{fill:#F8FAFC;font:700 28px 'Segoe UI',Arial,sans-serif;text-anchor:middle;animation:numGlow 3.4s ease-in-out infinite}.n2{animation-delay:.45s}.n3{animation-delay:.9s}.label{fill:#94A3B8;font:14px 'Segoe UI',Arial,sans-serif;text-anchor:middle}.current{fill:#22D3EE;font-weight:700;animation:cyanGlow 2.5s ease-in-out infinite}.date{fill:#64748B;font:12px 'Segoe UI',Arial,sans-serif;text-anchor:middle}.dot{fill:#22D3EE;animation:travel 4s ease-in-out infinite}@keyframes scan{from{transform:translateX(-120px)}to{transform:translateX(615px)}}@keyframes flow{to{stroke-dashoffset:-60}}@keyframes draw{from{stroke-dashoffset:210;opacity:.45}to{stroke-dashoffset:0;opacity:1}}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes flicker{from{transform:translateY(1px) scale(.9) rotate(-4deg)}to{transform:translateY(-