<svg xmlns="http://www.w3.org/2000/svg" width="900" height="96" viewBox="0 0 900 96" role="img"><title>GitHub Stats</title><defs><linearGradient id="a" x1="0" x2="1"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#10B981"/></linearGradient><filter id="g" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.frame{fill:none;stroke:url(#a);stroke-width:1.5;stroke-dasharray:90 22;animation:flow 5s linear infinite}.scan{fill:url(#a);opacity:.2;animation:scan 3.2s ease-in-out infinite}.prompt{fill:#22D3EE;font:18px monospace;filter:url(#g)}.cursor{animation:blink 1s steps(1) infinite}.bar{fill:url(#a);transform-box:fill-box;transform-origin:center bottom;animation:rise 1.8s ease-in-out infinite alternate}.b2{animation-delay:.3s}.b3{animation-delay:.6s}.b4{animation-delay:.9s}.dot{fill:#10B981;animation:pulse 1.6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-224}}@keyframes scan{0%,100%{transform:translateX(-760px)}50%{transform:translateX(760px)}}@keyframes blink{50%{opacity:0}}@keyframes rise{from{transform:scaleY(.35);opacity:.45}to{transform:scaleY(1);opacity:1}}@keyframes pulse{50%{opacity:.25;transform:scale(.65);transform-origin:center}}@media(prefers-reduced-motion:reduce){.frame,.scan,.cursor,.bar,.dot{animation:none}}</style></defs><rect class="frame" x="2" y="2" width="896" height="92" rx="18"/><rect class="scan" x="430" y="8" width="40" height="80" rx="20"/><circle class="dot" cx="28" cy="23" r="5"/><text class="prompt" x="50" y="31">&gt; github --stats<tspan class="cursor">_</tspan></text><g transform="translate(735 18)"><rect class="bar" x="0" y="34" width="18" height="28" rx="4"/><rect class="bar b2" x="28" y="20" width="18" height="42" rx="4"/><rect class="bar b3" x="56" y="5" width="18" height="57" rx="4"/><rect class="bar b4" x="84" y="27" width="18" height="35" rx="4"/></g><text x="50" y="65" fill="#94A3B8" font-family="Arial,sans-serif" font-size="13">LIVE DEVELOPMENT ACTIVITY · COMMITS · LANGUAGES</text></svg>
